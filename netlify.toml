[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/feed"
  to = "/.netlify/functions/podcast"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/api/newsletter"
  to = "/.netlify/functions/newsletter"
  status = 200

[[redirects]]
  from = "/api/analytics-event"
  to = "/.netlify/functions/analytics-event"
  status = 200

[[redirects]]
  from = "/api/analytics-report"
  to = "/.netlify/functions/analytics-report"
  status = 200

[[headers]]
  for = "/admin/analytics/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
