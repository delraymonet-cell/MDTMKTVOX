<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Readership Intelligence | MDNT MRKT CONT.</title><style>
:root{color-scheme:dark}body{background:#0a0a0a;color:#f5f5f0;font:15px/1.6 system-ui,sans-serif;margin:0;padding:28px}main{max-width:1100px;margin:auto}header{border-bottom:1px solid #444;padding-bottom:18px;margin-bottom:26px}small,.muted{color:#a9d0c5}h1{font-family:Georgia,serif;font-size:clamp(28px,5vw,48px);margin:8px 0}h2{font-size:18px}input,button{font:inherit;padding:10px 14px;border:1px solid #777;border-radius:5px}input{background:#222;color:white;max-width:400px;width:100%}button{background:#d8ef57;color:#111;cursor:pointer;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card,section{background:#151515;border:1px solid #333;border-radius:8px;padding:17px}.card strong{display:block;font-size:29px;color:#d8ef57}.card span{font-size:12px;color:#bbb}section{margin-top:20px}.columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #333;padding:6px 0;overflow-wrap:anywhere}#content[hidden]{display:none}p{max-width:75ch}a{color:#d8ef57}</style></head><body><main><header><small>MDNT MRKT CONT. / PRIVATE RESEARCH DESK</small><h1>Readership Intelligence<span style="color:#d8ef57">.</span></h1><p class="muted">First-party trends, 30-day lookback. Visitor locations are approximate. No raw IPs collected.</p></header>
<form id="login"><label for="token">Administrator access token</label><p><input type="password" id="token" autocomplete="off" required placeholder="Paste your Netlify analytics token"> <button>Unlock dashboard</button></p><p class="muted">Your token is held only in this browser tab, not saved to this website.</p></form><p id="message" role="status"></p><div id="content" hidden><div class="grid" id="metrics"></div><div class="columns" id="tables"></div><section><h2>Coverage and limitations</h2><p id="coverage"></p><ul id="unavailable"></ul><button id="refresh" type="button">Refresh</button> <button id="logout" type="button">Lock dashboard</button></section></div>
<script>const login=document.getElementById('login'),content=document.getElementById('content'),msg=document.getElementById('message');let token='';function rowTable(title,items){const s=document.createElement('section'),h=document.createElement('h2');h.textContent=title;s.append(h);for(const [k,v] of items){const d=document.createElement('div');d.className='row';const a=document.createElement('span'),b=document.createElement('strong');a.textContent=k;b.textContent=String(v);d.append(a,b);s.append(d)}return s}async function load(){msg.textContent='Loading…';const r=await fetch('/api/analytics-report',{headers:{Authorization:'Bearer '+token},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Access denied');login.hidden=true;content.hidden=false;msg.textContent=d.period+' · '+d.eventsAnalyzed+' events examined';const cards=[['Unique visitors',d.uniqueVisitors],['Page views',d.pageViews],['Sessions',d.sessions],['Library clicks',d.libraryClicks],['Publication clicks',d.publicationClicks],['Literary curiosity',d.readershipClickRate+'%'],['Genre migration',d.genreMigrationRate+'%'],['Delayed discovery',d.delayedDiscoveryRate+'%'],['Podcast plays',d.podcastPlays],['Bookseller actions',d.booksellerActions],['Bookseller intent',d.booksellerIntentRate===null?'N/A':d.booksellerIntentRate+'%']];const grid=document.getElementById('metrics');grid.replaceChildren();for(const [k,v]of cards){const box=document.createElement('div');box.className='card';const n=document.createElement('strong'),t=document.createElement('span');n.textContent=v;t.textContent=k;box.append(n,t);grid.append(box)}const tables=document.getElementById('tables');tables.replaceChildren();for(const [name,key]of [['Top pages','pages'],['Top publications','publications'],['Genres','genres'],['Referrers','referrals'],['Countries','countries'],['Regions','regions'],['Cities','cities'],['Outbound destinations','outboundDomains'],['Catalog affinities','catalogAffinity']])tables.append(rowTable(name,d[key]||[]));document.getElementById('coverage').textContent=d.caveat+(d.limited?' Event listing capped at 6,000; totals are incomplete.':'');document.getElementById('unavailable').replaceChildren(...d.unavailable.map(s=>{const li=document.createElement('li');li.textContent=s;return li}))}login.addEventListener('submit',async e=>{e.preventDefault();token=document.getElementById('token').value;try{await load()}catch(err){msg.textContent=err.message}});document.getElementById('refresh').onclick=()=>load().catch(e=>msg.textContent=e.message);document.getElementById('logout').onclick=()=>{token='';document.getElementById('token').value='';content.hidden=true;login.hidden=false;msg.textContent='Dashboard locked.'};</script></main></body></html>
